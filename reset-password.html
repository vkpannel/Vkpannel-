<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - VKPannel</title>
</head>
<body>

<h2>Reset Password</h2>

<input type="password" id="newPassword" placeholder="New password">
<input type="password" id="confirmPassword" placeholder="Confirm password">

<button id="resetBtn">Update Password</button>

<p id="message"></p>

<script type="module">
const { createClient } =
    await import("https://esm.sh/@supabase/supabase-js@2");

const supabase = createClient(
    "https://condkcjbmvghrexgcinn.supabase.co",
    "sb_publishable_g0UPWbNisSLTMdSBR8-6iw_EDQsilZ-"
);

document.getElementById("resetBtn").onclick = async () => {

    const password =
        document.getElementById("newPassword").value;

    const confirm =
        document.getElementById("confirmPassword").value;

    if (!password || password.length < 6) {
        alert("Password kam se kam 6 characters ka rakho.");
        return;
    }

    if (password !== confirm) {
        alert("Passwords match nahi kar rahe.");
        return;
    }

    const { error } =
        await supabase.auth.updateUser({
            password: password
        });

    if (error) {
        alert(error.message);
        return;
    }

    document.getElementById("message").innerText =
        "Password successfully updated!";

    setTimeout(() => {
        window.location.href = "login.html";
    }, 1500);
};
</script>

</body>
</html>
