<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VKPannel Admin</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        h1 {
            margin-bottom: 20px;
        }

        .request {
            background: #1e293b;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        button {
            padding: 10px 15px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 8px;
        }

        .approve {
            background: #22c55e;
            color: white;
        }

        .reject {
            background: #ef4444;
            color: white;
        }
    </style>
</head>

<body>

<h1>VKPannel Admin</h1>

<div id="requests">
    Checking admin access...
</div>

<script type="module">

const SUPABASE_URL =
    "https://condkcjbmvghrexgcinn.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_g0UPWbNisSLTMdSBR8-6iw_EDQsilZ-";

const ADMIN_USER_ID =
    "bdc50e50-e981-459e-b3d5-2fc489801dd1";

const { createClient } =
    await import(
        "https://esm.sh/@supabase/supabase-js@2"
    );

const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function checkAdmin() {

    const container =
        document.getElementById("requests");

    const {
        data: { user },
        error
    } = await supabase.auth.getUser();

    if (error || !user) {
        container.innerHTML =
            "Please login first.";
        return false;
    }

    if (user.id !== ADMIN_USER_ID) {
        container.innerHTML =
            "Access denied. Admin only.";
        return false;
    }

    return true;
}


async function loadRequests() {

    const container =
        document.getElementById("requests");

    const isAdmin =
        await checkAdmin();

    if (!isAdmin) {
        return;
    }

    container.innerHTML =
        "Loading requests...";

    const { data, error } =
        await supabase
            .from("deposit_requests")
            .select("*")
            .eq("status", "pending")
            .order("created_at", {
                ascending: false
            });

    if (error) {

        console.error(error);

        container.innerHTML =
            "Failed to load requests: " +
            error.message;

        return;
    }

    if (!data || data.length === 0) {

        container.innerHTML =
            "No pending deposit requests.";

        return;
    }

    container.innerHTML = "";

    data.forEach(request => {

        const div =
            document.createElement("div");

        div.className = "request";

        div.innerHTML = `
            <strong>Amount:</strong>
            ₹${Number(request.amount).toFixed(2)}
            <br>

            <strong>UTR:</strong>
            ${request.utr}
            <br>

            <strong>User ID:</strong>
            ${request.user_id}
            <br>

            <strong>Status:</strong>
            ${request.status}
            <br><br>

            <button class="approve">
                Approve
            </button>

            <button class="reject">
                Reject
            </button>
        `;

        div.querySelector(".approve").onclick =
            () => adminAction(request.id, "approve");

        div.querySelector(".reject").onclick =
            () => adminAction(request.id, "reject");

        container.appendChild(div);
    });
}


async function adminAction(id, action) {

    const {
        data: { session }
    } = await supabase.auth.getSession();

    if (!session) {
        alert("Please login first.");
        return;
    }

    try {

        const response =
            await fetch("/api/admin-deposit", {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        `Bearer ${session.access_token}`
                },

                body: JSON.stringify({
                    requestId: id,
                    action: action
                })
            });

        const result =
            await response.json();

        if (!response.ok) {
            throw new Error(
                result.error ||
                "Request failed"
            );
        }

        alert(
            result.message ||
            "Done"
        );

        await loadRequests();

    } catch (error) {

        console.error(error);

        alert(error.message);
    }
}


loadRequests();

</script>

</body>
</html>
